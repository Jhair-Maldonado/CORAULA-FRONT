name: Front-End CI (Next.js)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas frontend
        run: npm test

      - name: Ejecutar revisión de código (Linter)
        run: npm run lint

      - name: Compilar el proyecto (Build Test)
        run: npm run build
        env:
          NEXT_PUBLIC_APP_MODE: PRODUCTION
          NEXT_PUBLIC_API_URL: https://ci.invalid/api

      - name: Verificar que el build de producción no contiene usuarios demo
        run: |
          if grep -rl "demo.local" .next/static .next/server >/dev/null 2>&1; then
            echo "::error::El build de PRODUCTION contiene usuarios demo (demo.local)"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura (sin umbral)
        run: npm run test:coverage

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          {
            echo "## Cobertura del frontend"
            echo
            echo "Incluye src/, feature/ y layout/ completos, también los archivos que ninguna prueba carga (excluye src/types y .d.ts)."
            echo "**La cifra principal es Lines (proyecto completo).** Branches y Functions están infladas: cada archivo sin pruebas cuenta como una sola función y una sola rama."
            echo
            echo '```'
            npx c8 report --reporter=text-summary
            echo '```'
            echo
            echo "Reporte HTML y lcov en el artefacto \`coverage-report\`. No hay umbral obligatorio."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/lcov-report/
          retention-days: 14
          if-no-files-found: warn
